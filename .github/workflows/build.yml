name: Build and verify SafeInCloud
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check dist/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: SafeInCloud-Web
          path: dist/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeInCloud-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish windows/SafeinCloud.csproj -c Release -o output/windows
      - uses: actions/upload-artifact@v4
        with:
          name: SafeInCloud-Windows
          path: output/windows/

  release:
    needs: [web, android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: safeincloud-downloads
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SafeInCloud-Android-debug
          path: output/android
      - uses: actions/download-artifact@v4
        with:
          name: SafeInCloud-Windows
          path: output/windows
      - name: Package downloads
        run: |
          cp output/android/*.apk SafeInCloud-Android.apk
          cd output/windows
          zip -r ../../SafeInCloud-Windows-x64.zip .
          cd ../..
          sha256sum SafeInCloud-Android.apk SafeInCloud-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view downloads >/dev/null 2>&1 || gh release create downloads --target "$GITHUB_SHA" --title "SafeInCloud · Tải ứng dụng" --notes "Android: APK debug dùng thử. Windows x64: giải nén và chạy SafeinCloud.exe. Hai bản mở kho Web chung trên GitHub Pages. Chưa ký phát hành và chưa kiểm toán bảo mật độc lập."
          gh release upload downloads SafeInCloud-Android.apk SafeInCloud-Windows-x64.zip SHA256SUMS.txt --clobber

