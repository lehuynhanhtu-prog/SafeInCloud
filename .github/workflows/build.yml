name: Build and verify SafeInCloud
on: [push, workflow_dispatch]
concurrency:
  group: safeincloud-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --check dist/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: SafeInCloud-Web
          path: dist/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safeincloud-release.jks"
      - name: Test and build native release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/safeincloud-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android testDebugUnitTest assembleRelease
      - name: Verify release certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signing-certificate.txt
          grep -qi '366fe429c1160ab8b1a4bf4e0d987c0de675422e86aefd4149c880ddf94ae15e' signing-certificate.txt
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/safeincloud-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: SafeInCloud-Android-native
          path: android/app/build/outputs/apk/release/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish windows/SafeinCloud.csproj -c Release -o output/windows
      - uses: actions/upload-artifact@v4
        with:
          name: SafeInCloud-Windows
          path: output/windows/

  release:
    needs: [web, android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: safeincloud-downloads
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SafeInCloud-Android-native
          path: output/android
      - uses: actions/download-artifact@v4
        with:
          name: SafeInCloud-Windows
          path: output/windows
      - name: Package downloads
        run: |
          cp output/android/*.apk SafeInCloud-Android.apk
          cd output/windows
          zip -r ../../SafeInCloud-Windows-x64.zip .
          cd ../..
          sha256sum SafeInCloud-Android.apk SafeInCloud-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view downloads >/dev/null 2>&1 || gh release create downloads --target "$GITHUB_SHA" --title "SafeInCloud · Tải ứng dụng" --notes "SafeInCloud Native 1.3.1."
          gh release edit downloads --notes $'## Tải và sử dụng SafeInCloud\n\n- **Web / PWA:** [Mở SafeInCloud trên trình duyệt](https://lehuynhanhtu-prog.github.io/SafeInCloud/)\n- **Android:** tải `SafeInCloud-Android.apk` trong phần Assets.\n- **Windows:** tải `SafeInCloud-Windows-x64.zip` trong phần Assets.\n\nWeb 0.5.4 và Android Native 1.3.1 áp dụng một tài khoản Google = một file kho hiện hành dùng chung. Cài đặt hiển thị email đang đồng bộ; một nút đồng bộ tự xác định chiều cập nhật và file hiện hành được cập nhật tại chỗ. Đã bỏ “Mở kho từ Google Drive” và “Tải bản mã kho trước”. Android vẫn hỗ trợ nhập .db v1, tệp đính kèm, Email/Bank/Account, trường text/mật khẩu và sinh trắc học Android Keystore. Drive cần cấu hình OAuth đúng theo README. Chưa kiểm thử thiết bị thật hoặc kiểm toán độc lập.'
          gh release upload downloads SafeInCloud-Android.apk SafeInCloud-Windows-x64.zip SHA256SUMS.txt --clobber

