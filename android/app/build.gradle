plugins { id 'com.android.application' }
def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
android {
 namespace 'vn.safeincloud.personal'
 compileSdk 35
 defaultConfig { applicationId 'vn.safeincloud.personal'; minSdk 26; targetSdk 35; versionCode 8; versionName '1.3.1' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
  release {
   if (signingPath) { storeFile file(signingPath); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') }
  }
 }
 buildTypes { release { minifyEnabled false; if (signingPath) signingConfig signingConfigs.release } }
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !signingPath) {
 throw new GradleException('Release signing secrets are required; refusing unsigned release.')
}
dependencies {
 implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'androidx.fragment:fragment:1.8.5'
 implementation 'androidx.biometric:biometric:1.1.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'com.google.android.gms:play-services-auth:21.3.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
